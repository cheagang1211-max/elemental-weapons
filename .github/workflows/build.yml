# 코드를 올릴 때마다 빌드가 되는지 자동 검사 (배포는 하지 않음)
# 결과물 jar는 Actions 실행 페이지 하단 Artifacts 에서 받을 수 있어요.
name: Build (빌드 검사)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: elementalweapons-dev
          path: build/libs/*.jar

  # 실제 마인크래프트 서버를 켜서 모드가 오류 없이 로딩되는지 확인
  server-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: 서버 실행 테스트
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=elementalweapons\\\\:elemental_world\nspawn-protection=0\npause-when-empty-seconds=-1\n" > run/server.properties
          EW_SELFTEST=1 ./gradlew runServer --console=plain > server.log 2>&1 &
          OK=0
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log; then OK=1; break; fi
            if grep -qiE "crash report|Failed to start|Exception in thread \"main\"" server.log; then break; fi
            sleep 5
          done
          # 자가 테스트(보스 전투 약 35초) 결과 기다리기
          for i in $(seq 1 120); do
            if grep -qE "\[SELFTEST\] (PASS|FAIL)" server.log; then break; fi
            sleep 3
          done
          echo "@@@SERVER_LOG_BEGIN"
          grep -vE "^\s*at |Gradle|Daemon|> Task|BUILD|deprecat" server.log | grep -E "^\[|SELFTEST|SKY|^\s+at |Caused" | head -300
          echo "@@@SERVER_LOG_END"
          pkill -f runServer || true
          pkill -f "net.fabricmc" || true
          if [ "$OK" != "1" ]; then tail -120 server.log; exit 1; fi
          if ! grep -q "\[SELFTEST\] PASS" server.log; then
            echo "보스 자가 테스트 실패"; grep -B2 -A40 -iE "SELFTEST\] FAIL|Exception" server.log | head -120; exit 1
          fi

# 코드를 올릴 때마다 빌드가 되는지 자동 검사 (배포는 하지 않음)
# 결과물 jar는 Actions 실행 페이지 하단 Artifacts 에서 받을 수 있어요.
name: Build (빌드 검사)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: elementalweapons-dev
          path: build/libs/*.jar

name: shots
# 실제 게임 클라이언트를 가상 화면(xvfb)에서 띄워 스크린샷을 찍고 shots 브랜치에 올림
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: 가상 화면 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 > /dev/null
      - name: 세계 생성 (서버)
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=elementalweapons\\\\:elemental_world\nlevel-name=ew\nspawn-protection=0\n" > run/server.properties
          mkfifo srvin
          (tail -f srvin | ./gradlew runServer --console=plain > server.log 2>&1) &
          exec 3>srvin
          for i in $(seq 1 120); do grep -q "Done (" server.log && break; sleep 5; done
          sleep 10
          echo "stop" >&3
          for i in $(seq 1 30); do grep -q "All dimensions are saved\|Stopping server" server.log && break; sleep 2; done
          sleep 8
          pkill -TERM -f KnotServer || true
          sleep 5
          pkill -f runServer || true
          grep -E "Done \(|Stopping|saved" server.log | head
          mkdir -p run/saves && mv run/ew run/saves/ew && ls run/saves/ew
      - name: 클라이언트 실행 + 스크린샷
        run: |
          cat > run/options.txt <<'OPT'
          onboardAccessibility:false
          tutorialStep:none
          joinedFirstServer:true
          skipMultiplayerWarning:true
          guiScale:3
          renderDistance:8
          simulationDistance:8
          narrator:0
          soundCategory_master:0.0
          lang:ko_kr
          enableVsync:false
          maxFps:60
          OPT
          sed -i 's/^ *//' run/options.txt
          export EW_SHOTS=1 LIBGL_ALWAYS_SOFTWARE=1 MESA_VK_WSI_PRESENT_MODE=immediate MESA_VK_WSI_DEBUG=sw vblank_mode=0
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +extension Composite +render -noreset > xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          glxinfo -B 2>&1 | head -20 || true
          ./gradlew runClient --console=plain --args="--quickPlaySingleplayer ew --width 1280 --height 720" > client.log 2>&1 &
          for i in $(seq 1 150); do
            sleep 10
            if grep -q "\[SHOTS\] DONE" client.log; then echo "DONE at $i"; break; fi
            if ! pgrep -f KnotClient > /dev/null && [ $i -gt 6 ]; then echo "client exited at $i"; break; fi
            if [ $((i % 6)) = 0 ]; then echo "--- t=$((i*10))s: $(tail -1 client.log | cut -c1-200)"; fi
            if [ $i = 30 ]; then
              PID=$(jps -l | grep -viE "gradle|jps" | awk '{print $1}' | head -1); jps -l; echo "@@@JSTACK $i"; jstack $PID > js.txt 2>&1; grep -A30 '"Render thread"' js.txt | head -32; grep -A20 '"Server thread"' js.txt | head -22; grep -B2 -A12 -iE 'vulkan|shaderc|Worker-Main' js.txt | head -60
            fi
          done
          sleep 5
          pkill -f KnotClient || true
          echo "@@@CLIENT_LOG_BEGIN"
          grep -E "SHOTS|ERROR|Exception|Caused by|OpenGL|Vulkan|Backend|GL_|renderer" client.log | grep -v "^\s*at " | head -150
          tail -40 client.log
          echo "@@@CLIENT_LOG_END"
          ls -la run/screenshots || true
      - name: 스크린샷 올리기
        run: |
          mkdir -p /tmp/out && cp run/screenshots/*.png /tmp/out/ 2>/dev/null || true
          cp client.log /tmp/out/client.log; cp run/logs/latest.log /tmp/out/latest.log 2>/dev/null || true
          cd /tmp/out
          git init -q -b shots && git config user.name "shots-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "screenshots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots
